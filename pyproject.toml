[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wpf-benchmark"
version = "0.2.0"
description = "Wind power forecasting platform: datasets, tasks, baselines and batch evaluation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.0,<3",
  "pyarrow>=14",
]

[project.optional-dependencies]
deep = ["torch>=2.1,<3"]
gbdt = ["lightgbm>=4,<5"]
test = ["pytest>=8"]

[project.scripts]
wpf-benchmark = "wpf_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
